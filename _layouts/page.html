  </button>
</div>

<script>
  // Hiển thị popup một lần mỗi lần refresh
  window.addEventListener('load', () => {
    if (!sessionStorage.getItem('popupShown')) {
      document.getElementById('popup').style.display = 'block';
      sessionStorage.setItem('popupShown', 'true');
    }
  });
</script>
