<div id="comments-wrapper" style="margin-top: 50px; padding-top: 20px; border-top: 1px solid #eee;">
    <div id="disqus_thread"></div>
    <noscript>Vui lòng bật JavaScript để xem bình luận.</noscript>
</div>

<script>
(function() {
    // 1. Cấu hình định danh (Quan trọng để không mất comment)
    var disqus_config = function () {
        this.page.url = '{{ site.url }}{{ site.baseurl }}{{ page.url }}';
        this.page.identifier = '{{ page.url }}';
    };

    // 2. Hàm tải Disqus
    var loaded = false;
    function loadDisqus() {
        if (loaded) return;
        loaded = true;

        var d = document, s = d.createElement('script');
        s.src = 'https://{{ site.disqus_shortname }}.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
    }

    // 3. Lazy Load: Chỉ tải khi người dùng cuộn đến gần
    var observer = new IntersectionObserver(function(entries) {
        if (entries[0].isIntersecting) {
            loadDisqus();
            observer.disconnect(); // Ngắt quan sát sau khi đã tải
        }
    }, { rootMargin: '200px' }); // Tải trước khi cuộn tới 200px

    // Bắt đầu quan sát
    var wrapper = document.getElementById('comments-wrapper');
    if (wrapper) observer.observe(wrapper);
})();
</script>
